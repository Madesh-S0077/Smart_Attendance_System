name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env: { POSTGRES_USER: normai, POSTGRES_PASSWORD: normai_pass, POSTGRES_DB: normai_db }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U normai" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ${{ github.sha }}${{ github.sha }}
      DATABASE_URL: postgresql+asyncpg://normai:normai_pass@localhost:5432/normai_db
    defaults: { run: { working-directory: norm-ai-backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: alembic upgrade head
      - run: python -m app.seed_admin
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: norm-ai-frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: norm-ai-frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
