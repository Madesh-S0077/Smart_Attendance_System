[package]
name = "norm-ai-frontend"
version = "0.1.0"
description = "Norm AI — Smart Attendance System (Tauri Frontend)"
authors = ["RMK Engineering College"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "norm_ai_frontend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"  # Strip expensive panic clean-up code
codegen-units = 1
lto = true
opt-level = "s"  # Optimize for size
strip = true
