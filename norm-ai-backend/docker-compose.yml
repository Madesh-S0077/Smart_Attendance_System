
services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: normai
      POSTGRES_PASSWORD: normai_pass
      POSTGRES_DB: normai_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U normai -d normai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pg_data:
